name: Relo
options:
  bundleIdPrefix: com.example.relo
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: 120
    MARKETING_VERSION: 0.10.57
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: 1
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  ReloCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ReloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).core
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Relo:
    type: application
    platform: iOS
    sources:
      - path: Sources/ReloApp
      - path: Sources/SharedActivity
    dependencies:
      - target: ReloRuntime
      - target: ReloPersistence
      - target: ReloTransport
      - target: ReloNotificationSupport
      - target: ReloCore
      - target: ReloNotificationService
        embed: true
      - target: ReloLiveActivities
        embed: true
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: relo
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: com.example.relo.notifications.activity
            CFBundleURLSchemes:
              - relo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # ProMotion: without this the app is held to 60 Hz on iPhone.
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Relo connects to your notification server on the local network.
        NSCameraUsageDescription: Scan the QR code on Relo's web Dashboard to link that browser.
        NSUserActivityTypes:
          - INSendMessageIntent
        RELOAPIOrigin: $(RELO_API_ORIGIN)
        RELOBuildOrigin: $(RELO_API_ORIGIN)
        RELOSourceCommit: $(RELO_GIT_COMMIT)
        RELOAppGroup: $(RELO_APP_GROUP)
        RELOKeychainAccessGroup: $(AppIdentifierPrefix)$(RELO_BUNDLE_ID).e2ee
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    entitlements:
      path: Config/Relo.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.usernotifications.communication: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(RELO_BUNDLE_ID).e2ee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Relo.entitlements
      configs:
        Debug:
          OTHER_LDFLAGS[sdk=iphonesimulator*]: $(inherited) $(RELO_SIMULATOR_TEST_ENTITLEMENTS_FLAGS)
  ReloNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NotificationService
      - path: Sources/NotificationSupport
    info:
      path: Config/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: Relo Notification Service
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RELOAppGroup: $(RELO_APP_GROUP)
        RELOKeychainAccessGroup: $(AppIdentifierPrefix)$(RELO_BUNDLE_ID).e2ee
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Config/ReloNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(RELO_BUNDLE_ID).e2ee
    dependencies:
      - target: ReloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).service
        CODE_SIGN_ENTITLEMENTS: Config/ReloNotificationService.entitlements
        SKIP_INSTALL: YES
  ReloLiveActivities:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LiveActivities
      - path: Sources/SharedActivity
    dependencies:
      - target: ReloPersistence
      - target: ReloTransport
      - target: ReloNotificationSupport
      - target: ReloCore
    info:
      path: Config/LiveActivities-Info.plist
      properties:
        CFBundleDisplayName: Relo Live Activities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RELOAPIOrigin: $(RELO_API_ORIGIN)
        RELOBuildOrigin: $(RELO_API_ORIGIN)
        RELOSourceCommit: $(RELO_GIT_COMMIT)
        RELOAppGroup: $(RELO_APP_GROUP)
        RELOKeychainAccessGroup: $(AppIdentifierPrefix)$(RELO_BUNDLE_ID).e2ee
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/ReloLiveActivities.entitlements
      properties:
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(RELO_BUNDLE_ID).e2ee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).activities
        CODE_SIGN_ENTITLEMENTS: Config/ReloLiveActivities.entitlements
        SKIP_INSTALL: YES
  ReloNativeReferenceLiveActivities:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LiveActivities
      - path: Sources/SharedActivity
    dependencies:
      - target: ReloPersistence
      - target: ReloTransport
      - target: ReloNotificationSupport
      - target: ReloCore
    info:
      path: Config/NativeReferenceLiveActivities-Info.plist
      properties:
        CFBundleDisplayName: Relo Native Reference Activities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RELOAPIOrigin: $(RELO_API_ORIGIN)
        RELOAppGroup: $(RELO_APP_GROUP)
        RELOKeychainAccessGroup: $(AppIdentifierPrefix)$(RELO_BUNDLE_ID).e2ee
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/ReloLiveActivities.entitlements
      properties:
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(RELO_BUNDLE_ID).e2ee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).reference.activities
        CODE_SIGN_ENTITLEMENTS: Config/ReloLiveActivities.entitlements
        SKIP_INSTALL: YES
  ReloNativeReferenceHost:
    type: application
    platform: iOS
    sources:
      - path: Sources/NativeReferenceHost
      - path: Sources/SharedActivity
    dependencies:
      - target: ReloPersistence
      - target: ReloTransport
      - target: ReloNotificationSupport
      - target: ReloCore
      - target: ReloNativeReferenceLiveActivities
        embed: true
    info:
      path: Config/NativeReferenceHost-Info.plist
      properties:
        CFBundleDisplayName: Relo Native Reference
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RELOAPIOrigin: $(RELO_API_ORIGIN)
        RELOAppGroup: $(RELO_APP_GROUP)
        RELOKeychainAccessGroup: $(AppIdentifierPrefix)$(RELO_BUNDLE_ID).e2ee
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Config/NativeReferenceHost.entitlements
      properties:
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).reference
        CODE_SIGN_ENTITLEMENTS: Config/NativeReferenceHost.entitlements
  ReloCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReloCoreTests
    resources:
      - path: Tests/ReloCoreTests/Fixtures
    dependencies:
      - target: ReloRuntime
      - target: ReloPersistence
      - target: ReloTransport
      - target: ReloNotificationSupport
      - target: Relo
      - target: ReloCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Relo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Relo
        BUNDLE_LOADER: $(TEST_HOST)
  ReloNotificationSupportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReloNotificationSupportTests
    dependencies:
      - target: ReloNotificationSupport
      - target: ReloCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ReloAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReloAppTests
    dependencies:
      - target: ReloCore
      - target: ReloRuntime
      - target: ReloPersistence
      - target: ReloTransport
      - target: ReloNotificationSupport
      - target: Relo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Relo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Relo
        BUNDLE_LOADER: $(TEST_HOST)
  ReloRuntime:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ReloRuntime
    dependencies:
      - target: ReloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).reloruntime
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  ReloTransport:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ReloTransport
    dependencies:
      - target: ReloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).relotransport
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  ReloPersistence:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ReloPersistence
    dependencies:
      - target: ReloCore
      - target: ReloNotificationSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).relopersistence
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  ReloNotificationSupport:
    type: framework
    platform: iOS
    sources:
      - path: Sources/NotificationSupport
    dependencies:
      - target: ReloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).relonotificationsupport
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Relo:
    build:
      targets:
        Relo: all
        ReloCoreTests: [test]
        ReloNotificationSupportTests: [test]
        ReloAppTests: [test]
    test:
      targets:
        - ReloCoreTests
        - ReloNotificationSupportTests
        - ReloAppTests
  ReloNativeReference:
    build:
      targets:
        ReloNativeReferenceHost: all
    run:
      config: Debug
