name: Relo
options:
  bundleIdPrefix: com.example.relo
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 24
    MARKETING_VERSION: 0.9.12
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: 1
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  ReloCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ReloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  ReloActivityWire:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SharedActivity/ReloActivityAttributes.swift
    dependencies:
      - target: ReloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).activity-wire
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  ReloActivityResponse:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SharedActivity/ReloLiveActivityResponseIntent.swift
      - path: Sources/SharedActivity/ReloActivityAttributes.swift
    dependencies:
      - target: ReloCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).activity-response
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Relo:
    type: application
    platform: iOS
    sources:
      - path: Sources/ReloApp
      - path: Sources/SharedActivity
    dependencies:
      - target: ReloCore
      - target: ReloNotificationService
        embed: true
      - target: ReloLiveActivities
        embed: true
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Relo
        CFBundleURLTypes:
          - CFBundleURLName: com.example.relo.notifications.activity
            CFBundleURLSchemes:
              - relo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Relo connects to your notification server on the local network.
        NSCameraUsageDescription: Scan a Relo connection QR to connect this iPhone to your server.
        NSUserActivityTypes:
          - INSendMessageIntent
        RELOAPIOrigin: $(RELO_API_ORIGIN)
        RELOBuildOrigin: $(RELO_API_ORIGIN)
        RELOSourceCommit: $(RELO_GIT_COMMIT)
        RELOAppGroup: $(RELO_APP_GROUP)
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    entitlements:
      path: Config/Relo.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Relo.entitlements
  ReloNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NotificationService
      - path: Sources/NotificationSupport
    info:
      path: Config/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: Relo Notification Service
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RELOAppGroup: $(RELO_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Config/ReloNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).service
        CODE_SIGN_ENTITLEMENTS: Config/ReloNotificationService.entitlements
        SKIP_INSTALL: YES
  ReloLiveActivities:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LiveActivities
      - path: Sources/SharedActivity
    dependencies:
      - target: ReloCore
    info:
      path: Config/LiveActivities-Info.plist
      properties:
        CFBundleDisplayName: Relo Live Activities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RELOAPIOrigin: $(RELO_API_ORIGIN)
        RELOBuildOrigin: $(RELO_API_ORIGIN)
        RELOSourceCommit: $(RELO_GIT_COMMIT)
        RELOAppGroup: $(RELO_APP_GROUP)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/ReloLiveActivities.entitlements
      properties:
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).activities
        CODE_SIGN_ENTITLEMENTS: Config/ReloLiveActivities.entitlements
        SKIP_INSTALL: YES
  ReloNativeReferenceLiveActivities:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LiveActivities
      - path: Sources/SharedActivity
    dependencies:
      - target: ReloCore
    info:
      path: Config/NativeReferenceLiveActivities-Info.plist
      properties:
        CFBundleDisplayName: Relo Native Reference Activities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RELOAPIOrigin: $(RELO_API_ORIGIN)
        RELOAppGroup: $(RELO_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/ReloLiveActivities.entitlements
      properties:
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).reference.activities
        CODE_SIGN_ENTITLEMENTS: Config/ReloLiveActivities.entitlements
        SKIP_INSTALL: YES
  ReloNativeReferenceHost:
    type: application
    platform: iOS
    sources:
      - path: Sources/NativeReferenceHost
      - path: Sources/SharedActivity
    dependencies:
      - target: ReloCore
      - target: ReloNativeReferenceLiveActivities
        embed: true
    info:
      path: Config/NativeReferenceHost-Info.plist
      properties:
        CFBundleDisplayName: Relo Native Reference
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RELOAPIOrigin: $(RELO_API_ORIGIN)
        RELOAppGroup: $(RELO_APP_GROUP)
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Config/NativeReferenceHost.entitlements
      properties:
        com.apple.security.application-groups:
          - $(RELO_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELO_BUNDLE_ID).reference
        CODE_SIGN_ENTITLEMENTS: Config/NativeReferenceHost.entitlements
  ReloCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReloCoreTests
    resources:
      - path: Tests/ReloCoreTests/Fixtures
    dependencies:
      - target: ReloCore
      - target: ReloActivityWire
      - target: ReloActivityResponse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ReloNotificationSupportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/NotificationSupport
      - path: Tests/ReloNotificationSupportTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Relo:
    build:
      targets:
        Relo: all
        ReloCoreTests: [test]
        ReloNotificationSupportTests: [test]
    test:
      targets:
        - ReloCoreTests
        - ReloNotificationSupportTests
  ReloNativeReference:
    build:
      targets:
        ReloNativeReferenceHost: all
    run:
      config: Debug
