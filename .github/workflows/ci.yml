name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source gates
    # Contributor CI for the public repository; this private checkout is gated locally.
    if: github.repository == 'redpanda77/relo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Validate the public boundary
        run: |
          if [ -f LICENSE ]; then
            pnpm public:check
          else
            candidate="$(mktemp -d)/relo-candidate"
            pnpm public:stage -- "$candidate"
          fi
      - run: pnpm typecheck
      - run: node --test scripts/relo-latency-report.test.mjs
      - run: pnpm test
      - run: pnpm build

  postgres:
    name: PostgreSQL integration tests
    # Contributor CI for the public repository; this private checkout is gated locally.
    if: github.repository == 'redpanda77/relo'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: relo_test
          POSTGRES_USER: relo_test
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relo_test -d relo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://relo_test:integration-only@127.0.0.1:5432/relo_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @relo/server test

  swift:
    name: Swift package tests
    # Contributor CI for the public repository; this private checkout is gated locally.
    if: github.repository == 'redpanda77/relo'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version && swift --version
      - run: swift test --package-path apps/ios

  ios-native:
    name: iOS application and extension tests
    # Contributor CI for the public repository; this private checkout is gated locally.
    if: github.repository == 'redpanda77/relo'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Install project generator
        run: brew install xcodegen
      - name: Build shipping targets and run hosted tests unsigned
        env:
          RELO_DERIVED_DATA: ${{ runner.temp }}/relo-ios-build
        run: bash scripts/test-ios.sh
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relo-native-test-results
          path: ${{ runner.temp }}/relo-ios-build/*.xcresult
          if-no-files-found: warn

  cli-windows:
    name: CLI tests (Windows)
    # Contributor CI for the public repository; this private checkout is gated locally.
    if: github.repository == 'redpanda77/relo'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Before checkout: LF files, as in the published package (CRLF in the instruction-block sources would be
      # written into users' CLAUDE.md files and break the byte-count tests).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: CLI tests
        working-directory: packages/cli
        env:
          RELO_GATES_DEFER_TIMING: "1"
        run: |
          node scripts/bundle-skill.mjs
          node --import ./test/hermetic-env.mjs --test --test-timeout=120000
      - name: CLI timing tests, alone
        working-directory: packages/cli
        run: |
          node --import ./test/hermetic-env.mjs --test --test-timeout=120000 test/startup-budget.test.mjs test/harness-invariants.test.mjs

  contracts-windows:
    name: Contracts and owner-crypto tests (Windows)
    if: github.repository == 'redpanda77/relo'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @relo/notification-contracts test
      - run: pnpm --filter @relo/owner-crypto test
      - run: pnpm --filter @relo/owner-client typecheck
      - run: pnpm --filter @relo/owner-client test
